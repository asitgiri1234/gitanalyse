<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitAnalyse</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b1020;
      --card: #151b2e;
      --card-2: #1b2340;
      --text: #e8ecff;
      --muted: #aab3d3;
      --accent: #4f8cff;
      --danger: #ff6b6b;
      --ok: #42d392;
      --border: rgba(255, 255, 255, 0.14);
    }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #0b1020, #111936);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      width: min(900px, 100%);
      background: rgba(21, 27, 46, 0.92);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      padding: 20px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.4rem;
    }
    .hint {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input[type="text"] {
      flex: 1 1 320px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      padding: 11px 12px;
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(79, 140, 255, 0.25);
    }
    button {
      border: 0;
      background: var(--accent);
      color: white;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
    }
    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }
    .status {
      margin-top: 12px;
      min-height: 1.25rem;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .status.error {
      color: var(--danger);
    }
    .status.success {
      color: var(--ok);
    }
    .result {
      margin-top: 14px;
      display: grid;
      gap: 10px;
    }
    .section {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .section h2 {
      margin: 0 0 8px;
      font-size: 1rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 8px;
    }
    .metric {
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
    }
    .metric .label {
      color: var(--muted);
      font-size: 0.78rem;
      margin-bottom: 4px;
    }
    .metric .value {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .list {
      margin: 0;
      padding-left: 18px;
      line-height: 1.45;
    }
    .list li + li {
      margin-top: 6px;
    }
    .pill {
      display: inline-block;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.07);
      margin-left: 8px;
      vertical-align: middle;
    }
    details {
      margin-top: 6px;
    }
    summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 0.9rem;
      user-select: none;
    }
    pre {
      margin: 8px 0 0;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      max-height: 58vh;
      overflow: auto;
      font-size: 0.86rem;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>GitHub Profile Analyzer</h1>
    <p class="hint">
      Paste a GitHub username. The result is shown as JSON and cached in your database automatically.
    </p>
    <div class="controls">
      <input id="username" type="text" placeholder="e.g. asitgiri1234" autocomplete="off" />
      <button id="analyzeBtn" type="button">Analyze</button>
    </div>
    <div id="status" class="status"></div>
    <div id="result" class="result">
      <div class="section">
        <h2>Result</h2>
        <div class="hint">Enter a username and click Analyze.</div>
      </div>
    </div>
  </main>

  <script>
    const usernameInput = document.getElementById("username");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");

    function setStatus(message, isError = false) {
      statusEl.textContent = message || "";
      statusEl.classList.toggle("error", Boolean(isError));
      statusEl.classList.toggle("success", !isError && Boolean(message));
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function formatNumber(value) {
      if (value === null || value === undefined) return "-";
      if (typeof value !== "number") return String(value);
      return value.toLocaleString("en-US");
    }

    function metric(label, value) {
      return `
        <div class="metric">
          <div class="label">${escapeHtml(label)}</div>
          <div class="value">${escapeHtml(formatNumber(value))}</div>
        </div>
      `;
    }

    function renderStructured(data) {
      const insights = Array.isArray(data.insights) ? data.insights : [];
      const topRepos = Array.isArray(data.top_repositories) ? data.top_repositories : [];
      const repoStats = data.repository_stats || {};
      const langEntries = Object.entries(data.language_breakdown || {})
        .sort((a, b) => b[1] - a[1]);
      const topLangs = langEntries.slice(0, 5);

      const mostStarred = data.most_starred_repository;
      const sourceBadge = data.cached
        ? '<span class="pill">Returned from DB cache</span>'
        : '<span class="pill">Fetched from GitHub + cached</span>';

      resultEl.innerHTML = `
        <section class="section">
          <h2>Profile Overview ${sourceBadge}</h2>
          <div class="grid">
            ${metric("Username", data.username || "-")}
            ${metric("Name", data.name || "-")}
            ${metric("Followers", data.followers_count)}
            ${metric("Following", data.following_count)}
            ${metric("Public Repositories", data.public_repo_count)}
            ${metric("Account Age (years)", data.account_age_years ?? "-")}
            ${metric("Joined GitHub", data.joined_at ? String(data.joined_at).slice(0, 10) : "-")}
          </div>
        </section>

        <section class="section">
          <h2>Impact Metrics</h2>
          <div class="grid">
            ${metric("Total Stars", data.total_stars_received)}
            ${metric("Total Forks", data.total_forks_received)}
            ${metric("Total Watchers", data.total_watchers)}
            ${metric("Most Starred Repo", mostStarred ? mostStarred.name : "-")}
            ${metric("Most Starred Repo Stars", mostStarred ? mostStarred.stars : "-")}
          </div>
        </section>

        <section class="section">
          <h2>Repository Statistics</h2>
          <div class="grid">
            ${metric("Original Repos", repoStats.original_repositories)}
            ${metric("Forked Repos", repoStats.forked_repositories)}
            ${metric("Fork Ratio %", repoStats.fork_ratio_percent)}
            ${metric("Repos With Stars", repoStats.repositories_with_stars)}
            ${metric("Avg Stars / Repo", repoStats.average_stars_per_repo)}
            ${metric("Median Stars / Repo", repoStats.median_stars_per_repo)}
            ${metric("Avg Forks / Repo", repoStats.average_forks_per_repo)}
            ${metric("Updated in Last 90 Days", repoStats.recently_updated_count_90d)}
            ${metric("License Coverage %", repoStats.repositories_with_license_percent)}
            ${metric("Description Coverage %", repoStats.repositories_with_description_percent)}
            ${metric("Topic Coverage %", repoStats.repositories_with_topics_percent)}
            ${metric("Stale Repos (>180d)", repoStats.stale_repositories_180d_count)}
            ${metric("Avg Open Issues / Repo", repoStats.average_open_issues_per_repo)}
          </div>
        </section>

        <section class="section">
          <h2>Language and Domain Intelligence</h2>
          <div class="grid">
            ${metric("Primary Domain", repoStats.primary_domain ? repoStats.primary_domain.replaceAll("_", " ") : "-")}
            ${metric("Domain Confidence %", repoStats.domain_confidence_percent)}
            ${metric("Primary Language", repoStats.primary_language || "-")}
            ${metric("Languages Used", repoStats.languages_used_count)}
          </div>
          ${Object.keys(repoStats.domain_breakdown || {}).length
            ? `<ul class="list">${Object.entries(repoStats.domain_breakdown).map(([domain, score]) =>
                `<li><strong>${escapeHtml(domain.replaceAll("_", " "))}</strong>: ${escapeHtml(formatNumber(score))}%</li>`
              ).join("")}</ul>`
            : '<div class="hint">Domain signals are limited for this profile.</div>'}
        </section>

        <section class="section">
          <h2>Top Languages</h2>
          ${topLangs.length
            ? `<ul class="list">${topLangs.map(([language, count]) =>
                `<li><strong>${escapeHtml(language)}</strong>: ${escapeHtml(formatNumber(count))} repo(s)</li>`
              ).join("")}</ul>`
            : '<div class="hint">No language data available.</div>'}
        </section>

        <section class="section">
          <h2>Top Repositories</h2>
          ${topRepos.length
            ? `<ul class="list">${topRepos.slice(0, 5).map((repo) =>
                `<li>
                  <strong>${escapeHtml(repo.name)}</strong> — ⭐ ${escapeHtml(formatNumber(repo.stars))}
                  ${repo.language ? ` — ${escapeHtml(repo.language)}` : ""}
                  ${repo.quality_score !== undefined ? ` — Quality ${escapeHtml(formatNumber(repo.quality_score))}` : ""}
                </li>`
              ).join("")}</ul>`
            : '<div class="hint">No public repositories found.</div>'}
        </section>

        <section class="section">
          <h2>Insights</h2>
          ${insights.length
            ? `<ul class="list">${insights.map((insight) =>
                `<li><strong>${escapeHtml(insight.title)}</strong>: ${escapeHtml(insight.description)}</li>`
              ).join("")}</ul>`
            : '<div class="hint">No insights generated.</div>'}
        </section>

        <section class="section">
          <h2>Raw JSON</h2>
          <details>
            <summary>Show raw response</summary>
            <pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre>
          </details>
        </section>
      `;
    }

    async function analyze() {
      const username = (usernameInput.value || "").trim();
      if (!username) {
        setStatus("Please enter a GitHub username.", true);
        return;
      }

      analyzeBtn.disabled = true;
      setStatus("Analyzing...");

      try {
        const response = await fetch("/api/profiles/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, force_refresh: false })
        });

        const data = await response.json();

        if (!response.ok) {
          renderStructured(data);
          setStatus(data.detail || "Request failed.", true);
          return;
        }

        renderStructured(data);
        setStatus(data.cached
          ? "Returned from database cache."
          : "Fetched from GitHub and stored in database.");
      } catch (error) {
        setStatus("Network error. Ensure the backend is running.", true);
        renderStructured({ error: String(error) });
      } finally {
        analyzeBtn.disabled = false;
      }
    }

    analyzeBtn.addEventListener("click", analyze);
    usernameInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        analyze();
      }
    });
  </script>
</body>
</html>
