services:
  - type: web
    name: gitanalyse-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gitanalyse-db
          property: connectionString
      - key: GITHUB_TOKEN
        sync: false

databases:
  - name: gitanalyse-db
    plan: free
